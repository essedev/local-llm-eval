<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookTrack</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        min-height: 100vh;
      }
      #root { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
      h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 2rem;
        color: #fff;
        letter-spacing: -0.5px;
      }
      h1 span { color: #6ee7b7; }

      /* Form */
      .add-form {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .add-form input, .add-form select {
        padding: 0.6rem 0.8rem;
        border: 1px solid #333;
        border-radius: 8px;
        background: #1a1a1a;
        color: #e0e0e0;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }
      .add-form input:focus, .add-form select:focus {
        border-color: #6ee7b7;
      }
      .add-form input[type="text"] { flex: 1; min-width: 120px; }
      .add-form select { min-width: 110px; }
      .add-form button {
        padding: 0.6rem 1.4rem;
        border: none;
        border-radius: 8px;
        background: #6ee7b7;
        color: #0f0f0f;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .add-form button:hover { background: #34d399; }

      /* Stats */
      .stats {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
      }
      .stat {
        flex: 1;
        min-width: 80px;
        text-align: center;
        padding: 0.8rem;
        border-radius: 10px;
        background: #1a1a1a;
        border: 1px solid #222;
      }
      .stat .num { font-size: 1.6rem; font-weight: 700; }
      .stat .label { font-size: 0.75rem; color: #888; margin-top: 0.2rem; }
      .stat.to-read .num { color: #60a5fa; }
      .stat.reading .num { color: #fbbf24; }
      .stat.done .num { color: #6ee7b7; }

      /* Book list */
      .book-list { display: flex; flex-direction: column; gap: 0.5rem; }
      .book-card {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.9rem 1rem;
        background: #1a1a1a;
        border: 1px solid #222;
        border-radius: 10px;
        transition: border-color 0.2s;
      }
      .book-card:hover { border-color: #444; }
      .book-info { flex: 1; min-width: 0; }
      .book-title {
        font-weight: 600;
        font-size: 1rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .book-author {
        font-size: 0.85rem;
        color: #888;
        margin-top: 0.15rem;
      }
      .book-status {
        padding: 0.3rem 0.7rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        white-space: nowrap;
        cursor: pointer;
        border: none;
        transition: opacity 0.2s;
      }
      .book-status:hover { opacity: 0.8; }
      .book-status.to-read { background: #1e3a5f; color: #60a5fa; }
      .book-status.reading { background: #422006; color: #fbbf24; }
      .book-status.done { background: #064e3b; color: #6ee7b7; }

      .delete-btn {
        background: none;
        border: none;
        color: #555;
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0.3rem;
        border-radius: 6px;
        transition: color 0.2s, background 0.2s;
      }
      .delete-btn:hover { color: #f87171; background: #2a1010; }

      .empty {
        text-align: center;
        color: #555;
        padding: 3rem 0;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
